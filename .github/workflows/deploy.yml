name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: candle-host

    steps:
      # Step 1: Pull the latest code from GitHub onto the VM
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Rebuild the Docker containers with the new code
      - name: Rebuild and restart Docker containers
        run: |
          docker compose down
          docker compose up -d --build